<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cornerpin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121317'/%3E%3Cpath d='M6 9l20-3-3 20-15-4z' fill='%23ffb020'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="bar">
  <strong class="brand">Cornerpin</strong>
  <input id="projName" class="name" type="text" aria-label="Project name" spellcheck="false">
  <span class="sep"></span>
  <button id="addQuad" title="Add a 4-corner surface">+ Quad</button>
  <button id="addBox" title="Add three quads with shared corners">+ Box</button>
  <button id="undo" title="Undo (Cmd+Z)">Undo</button>
  <button id="redo" title="Redo (Shift+Cmd+Z)">Redo</button>
  <span class="sep"></span>
  <button id="openOut" class="primary" title="Open the projector window">Open output</button>
  <select id="outSize" aria-label="Output size" title="Output size in pixels"></select>
  <span id="customSize" hidden>
    <input id="outW" type="number" min="16" max="8192" step="2" aria-label="Output width"> x
    <input id="outH" type="number" min="16" max="8192" step="2" aria-label="Output height">
  </span>
  <label class="chk" title="Show outlines and points on the projector while aligning (G)"><input id="guides" type="checkbox" checked> Guides</label>
  <label class="chk" title="Show an alignment grid behind the shapes"><input id="testPattern" type="checkbox"> Test pattern</label>
  <button id="playPause" title="Play or pause (Space)">Pause</button>
  <button id="restart" title="Restart all videos">Restart</button>
  <span class="grow"></span>
  <button id="exportBtn" class="primary">Export</button>
  <button id="newProj" title="Clear all shapes (undoable)">New</button>
</header>

<main id="main">
  <section id="stage">
    <canvas id="scene"></canvas>
    <canvas id="overlay"></canvas>
    <div id="empty" hidden>Add a quad or a box to start mapping.</div>
  </section>
  <aside id="side">
    <section>
      <h2>Layers</h2>
      <div id="layers"></div>
    </section>
    <section>
      <h2>Shape</h2>
      <div id="props"></div>
    </section>
    <section>
      <h2>Media <button id="importMedia" class="small">Import</button></h2>
      <div id="mediaList"></div>
      <input id="fileInput" type="file" accept="video/*,image/*" multiple hidden>
    </section>
  </aside>
</main>

<footer id="status">
  <span id="hint">Drag points to align. Click an edge to add a point. Delete removes it. Hold Cmd to skip snapping, Option to move one corner of a shared set. Arrows nudge 1 px (Shift: 10).</span>
  <span class="grow"></span>
  <span id="msg"></span>
  <span id="storage"></span>
  <span id="build" title="Deployed commit"></span>
</footer>

<dialog id="exportDlg">
  <form method="dialog">
    <h2>Export</h2>
    <fieldset>
      <legend>Mapped video</legend>
      <div class="row"><label for="exDur">Duration (s)</label><input id="exDur" type="number" min="0.1" max="3600" step="0.1" value="10"></div>
      <div class="row"><label for="exFps">Frame rate</label><select id="exFps"><option>24</option><option>25</option><option selected>30</option><option>60</option></select></div>
      <div class="row"><label for="exBitrate">Bitrate (Mbps)</label><input id="exBitrate" type="number" min="1" max="100" step="1" value="12"></div>
      <div class="row"><label for="exMode">Method</label><select id="exMode">
        <option value="offline">Offline render, frame-accurate MP4</option>
        <option value="realtime">Real-time recording</option>
      </select></div>
      <p id="exInfo" class="note"></p>
      <div class="row"><progress id="exProgress" value="0" max="1" hidden></progress></div>
      <div class="actions">
        <button id="exStart" type="button" class="primary">Export video</button>
        <button id="exCancel" type="button" hidden>Cancel</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Shapes and layout</legend>
      <div class="actions">
        <button id="exSVG" type="button" title="Shape outlines at output size, for Photoshop or Illustrator">Export SVG</button>
        <button id="exJSON" type="button" title="Layout without media">Export JSON</button>
        <button id="imJSON" type="button">Import JSON</button>
      </div>
      <input id="jsonInput" type="file" accept="application/json,.json" hidden>
    </fieldset>
    <div class="actions end"><button id="exClose" type="submit">Close</button></div>
  </form>
</dialog>

<script>
  const BUILD = 'dev';
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
